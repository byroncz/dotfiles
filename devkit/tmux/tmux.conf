# devkit: tmux invisible. Su única función es mantener la sesión viva.
#   Ctrl-b d   desconectar sin cerrar nada
# Los splits los hace Neovim, no tmux.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
set -g renumber-windows on
set -g set-clipboard off

# tmux no captura el ratón: Terminal.app conserva la selección nativa y las
# aplicaciones (Neovim) piden el ratón por su cuenta cuando lo necesitan.
set -g mouse off

# Barra de estado mínima.
set -g status-style "bg=default,fg=colour244"
set -g status-left "#[fg=colour39]#S #[fg=colour244]| "
set -g status-right "#[fg=colour244]Ctrl-b d: desconectar"
set -g window-status-current-style "fg=colour255,bold"
