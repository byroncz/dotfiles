# Prompt de una sola línea (DEVKIT-63): reemplaza al preset "Plain Text" que
# traía el template (símbolos ASCII para git, el lenguaje del directorio, el
# contenedor, ...). Ese preset mostraba módulos que no aportan en este
# workspace -no hay proyecto de un lenguaje que detectar, y `git`/`container`
# repetían lo que ya dice esta línea- y ninguno resumía lo que sí importa acá:
# agentes vivos y alarmas de watch.log. `format` solo nombra dos módulos:
# todo lo demás queda sin efecto aunque esta plantilla trajera su config.
#
# `${custom.devkit}` corre devkit/scripts/prompt-status.sh, que arma la línea
# completa en un solo proceso (detalle y presupuesto de 50 ms por módulo en
# la entrada de Documentación "Arquitectura del devkit" (Notion), sección
# 4.4). `style = ""` es necesario: sin él, starship
# envuelve la salida del módulo con su propio estilo por defecto y pisa el
# color por prefijo que el script ya deja en ANSI crudo.
format = """${custom.devkit}$character"""

# DEVKIT-149: el default de starship (500 ms) es más corto de lo que tarda
# prompt-status.sh mientras el contenedor arranca -índice de git frío, clon
# recién hecho-, así que starship corta el módulo y avisa "timed out" antes
# de cada prompt. 1500 ms cubre ese caso puntual sin ser tan largo como para
# ocultar un prompt realmente colgado. Va a nivel global porque también
# aplica a los módulos de git propios de starship, no solo a custom.devkit.
command_timeout = 1500

continuation_prompt = "[.](bright-black) "

[character]
success_symbol = "[>](bold green)"
error_symbol = "[x](bold red)"
vimcmd_symbol = "[<](bold green)"
vimcmd_visual_symbol = "[<](bold yellow)"
vimcmd_replace_symbol = "[<](bold purple)"
vimcmd_replace_one_symbol = "[<](bold purple)"

[custom.devkit]
command = "${DEVKIT_SCRIPTS_DIR:-/opt/devkit/scripts}/prompt-status.sh"
when = "true"
shell = ["bash", "--noprofile", "--norc"]
style = ""
format = "$output "
