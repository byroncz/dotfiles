# devkit: dos contenedores por proyecto.
#   dev    -> donde trabajas. Sin salida directa a internet.
#   proxy  -> único con salida, filtrada por lista blanca.
#
# Este archivo se copia a ~/.devkit/<proyecto>/ junto con:
#   .env        variables de interpolación de compose (proyecto, versión, apt
#                extra, dominios extra, extensiones del editor ya resueltas,
#                zona horaria del Mac). new-project.sh la crea; devkit.sh la
#                mantiene al día leyendo .devkit/devkit.toml del contenedor,
#                vscode/extensions.toml del template y /etc/localtime del
#                Mac: es una copia derivada, no se edita a mano.
#   devkit.env  variables que entran al contenedor (las editas tú: repo,
#                identidad git, remoto de Dropbox)
#   template/   copia del template en la versión declarada (contexto de build)
name: devkit-${DEVKIT_PROJECT}

services:
  dev:
    build:
      context: ./template
      args:
        EXTRA_APT: ${DEVKIT_EXTRA_APT:-}
        EXTENSIONS: ${DEVKIT_EXTENSIONS:-}
    image: devkit:${DEVKIT_VERSION}
    container_name: devkit-${DEVKIT_PROJECT}
    hostname: ${DEVKIT_PROJECT}
    init: true
    tty: true
    stdin_open: true
    env_file: devkit.env
    environment:
      DEVKIT_PROJECT: ${DEVKIT_PROJECT}
      DEVKIT_VERSION: ${DEVKIT_VERSION}
      # Zona horaria del Mac, detectada por devkit.sh (DEVKIT-64): así `date`
      # y los logs quedan en su hora. Sin zona detectable: UTC.
      TZ: ${DEVKIT_TZ:-UTC}
      HTTP_PROXY: http://proxy:8888
      HTTPS_PROXY: http://proxy:8888
      NO_PROXY: localhost,127.0.0.1,proxy
      # Puerto del retorno OAuth de los servidores MCP (plugin de Notion): debe
      # ser el mismo que el publicado en el host (DEVKIT_OAUTH_PORT), o la URL
      # de retorno que arma Claude Code no coincide con lo que Docker publica.
      MCP_OAUTH_CALLBACK_PORT: "${DEVKIT_OAUTH_PORT:-54545}"
    secrets:
      - bws_token
    tmpfs:
      - /run/devkit:mode=700,uid=1000,gid=1000
    volumes:
      - claude:/home/dev/.claude
      - history:/commandhistory
      - proxy-log:/var/log/devkit-proxy:ro
    networks:
      - internal
    depends_on:
      - proxy

  proxy:
    build: ./template/proxy
    image: devkit-proxy:${DEVKIT_VERSION}
    container_name: devkit-${DEVKIT_PROJECT}-proxy
    init: true
    environment:
      DEVKIT_ALLOW_DOMAINS: ${DEVKIT_ALLOW_DOMAINS:-}
      DEVKIT_NET_OPEN: ${DEVKIT_NET_OPEN:-0}
    volumes:
      - proxy-log:/var/log/tinyproxy
    ports:
      # Retorno OAuth de los MCP (plugin de Notion). Docker no publica puertos
      # de contenedores que solo están en una red interna, así que entra por el
      # proxy: host localhost:${DEVKIT_OAUTH_PORT} -> proxy:45454 -> dev:45454 ->
      # 127.0.0.1:${MCP_OAUTH_CALLBACK_PORT} dentro de dev, donde escucha Claude
      # Code (mismo número que DEVKIT_OAUTH_PORT). Cada salto lo hace socat.
      # El relé interno (45454) es un puerto fijo ajeno a la familia
      # 54545/54546/... de DEVKIT_OAUTH_PORT: si coincidieran, el socat de
      # dev intentaría reenviarse a sí mismo (DEVKIT-155, H5).
      - "127.0.0.1:${DEVKIT_OAUTH_PORT:-54545}:45454"
      # Editor VS Code (openvscode-server), gateado por token de conexión:
      # Mac localhost:${DEVKIT_VSCODE_PORT} -> proxy:3001 -> dev:3001 ->
      # 127.0.0.1:3000 dentro de dev, donde escucha el servidor. Mismo patrón
      # que el OAuth de arriba. `devkit code <proyecto>` arma la URL con el
      # token.
      - "127.0.0.1:${DEVKIT_VSCODE_PORT:-3000}:3001"
    networks:
      - internal
      - egress

networks:
  internal:
    internal: true
  egress: {}

volumes:
  claude:
    name: claude-${DEVKIT_PROJECT}
  history:
    name: history-${DEVKIT_PROJECT}
  proxy-log:
    name: proxylog-${DEVKIT_PROJECT}

secrets:
  bws_token:
    file: ${DEVKIT_BWS_TOKEN_FILE:-~/.devkit/bws-token}
