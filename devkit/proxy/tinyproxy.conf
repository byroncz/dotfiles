User tinyproxy
Group tinyproxy
Port 8888
Timeout 600
MaxClients 64
LogLevel Connect
LogFile "/var/log/tinyproxy/tinyproxy.log"
PidFile "/run/tinyproxy.pid"

# Solo redes privadas de Docker.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# CONNECT solo a HTTPS y SSH.
ConnectPort 443
ConnectPort 22

# Lista blanca por dominio. FilterType fnmatch: "*.github.com" no incluye
# "github.com", por eso el archivo lista ambos.
FilterType fnmatch
FilterURLs Off
FilterCaseSensitive Off
Filter "/etc/tinyproxy/allowlist"
# FilterDefaultDeny lo escribe entrypoint.sh: Yes (normal) o No (red abierta).
