# Tabla rol -> modelo, esfuerzo y presupuesto de turnos, en un solo archivo
# del template (DEVKIT-45, reescrita en DEVKIT-54). La lee
# `devkit/scripts/devkit-run.sh`, el único punto de lanzamiento de una skill
# en segundo plano; ver ese script para cómo se resuelve el rol de cada
# skill.
#
# Modelo por papel en el flujo, no por Tipo de la card (DEVKIT-54): un mal
# desglose de Épica o una revisión floja cuestan más que cualquier card
# individual, y el modelo barato no ahorró nada en la práctica (evidencia en
# la entrada de Documentación de DEVKIT-54: DEVKIT-51 en Sonnet necesitó tres
# ciclos, y un task-fix en Haiku por rol `chore` concluyó "nada que corregir"
# con un veredicto CAMBIOS vigente). El Tipo sigue eligiendo el prefijo de
# rama (`feat/`, `fix/`, `chore/`); ya no elige modelo.
#
# `frontera` es la lista ordenada de modelos de frontera, por alias de
# `claude --model`. `devkit-run` prueba el primero disponible en cada
# arranque (una llamada mínima por modelo, cacheada en `/run/devkit/`) y cae
# al siguiente si no responde. Cada rol declara `model_index`: la posición
# (1-based) en esta lista desde la que empieza a buscar.
frontera = ["fable", "opus", "sonnet"]

# revisión: pr-review corre en el segundo modelo de la lista, no en el
# primero (DEVKIT-72). Con `frontera = ["fable", "opus", "sonnet"]`, Fable
# cuesta el doble por token que Opus (USD 10/50 frente a 5/25 por millón de
# tokens de entrada/salida) y la evidencia de Opus como implementador ya
# está: los PR 39 a 43 necesitaron 1, 1, 0, 0 y 0 ciclos de corrección
# (DEVKIT-54). `max_turns` es un presupuesto, no un límite: la CLI instalada
# (2.1.270) no expone `--max-turns`, así que devkit-run compara `num_turns`
# del resultado contra este número y solo avisa en el log si se excede.
#
# `resolver_modelo` solo avanza desde `model_index` hacia el final de la
# lista, nunca hacia atrás: si Opus no responde, cae a Sonnet y ahí se queda,
# sin volver a probar Fable. Subir a Fable en ese momento anularía el ahorro
# que justifica el índice 2, y la caída ya queda registrada en watch.log
# (`resumen`, DEVKIT-72).
revision.model_index = 2
revision.effort = "high"
revision.max_turns = 50

# epic-plan pesa más que pr-review dentro de revisión: un mal desglose se
# paga en todas sus hijas, así que se queda en el primer modelo de frontera
# (anulación por skill sobre revision.model_index, DEVKIT-72) y sube a
# esfuerzo máximo.
epic-plan.model_index = 1
epic-plan.effort = "max"

# implementación: task-start, task-fix, task-submit y task-document.
# Segundo modelo de la lista.
implementacion.model_index = 2
implementacion.effort = "high"
implementacion.max_turns = 40

# Escalera por ronda (DEVKIT-61), un experimento: empezar con el modelo barato
# y subir solo si el PR no pasa la revisión. Cada elemento es
# `<alias de claude --model>:<esfuerzo>` y su posición es la ronda. La ronda es
# 1 para task-start, task-submit y task-document (DEVKIT-92: ya no escala, ver
# DEVKIT-83), y para task-fix es 1 más el número de comentarios
# `<!-- devkit-fix` del PR de la card. Una ronda mayor que la lista usa el
# último elemento. Si el alias no responde, se usa el modelo de `model_index`
# y watch.log lo dice. Para desactivarla, quita la línea: `model_index` y
# `effort` vuelven a mandar.
implementacion.rondas = ["sonnet:high", "sonnet:high", "opus:high"]

# `revision.rondas` no existe a propósito: el revisor es la compuerta de
# calidad y un modelo más débil da OK falsos que nadie detecta. Si alguien la
# declara, devkit-run la ignora y lo escribe en watch.log.

# No hay rol para cerrar ni bloquear una card (DEVKIT-55): `task-close.sh` y
# `task-block.sh` son bash contra la API de Notion y no lanzan modelo. El rol
# `contabilidad` que los agrupaba se retiró con ellos.

# Presupuesto de turnos por skill (DEVKIT-94), clave punteada bajo
# `presupuesto` con el mismo mecanismo que anula `model_index`/`effort` por
# skill (`role_field`, arriba): no hace falta un parser de tablas nuevo, el
# grep de `role_field presupuesto <skill>` ya entiende
# `presupuesto.<skill> = N` como TOML de clave punteada válido. Antes, el
# único presupuesto era el de `implementacion.max_turns`/`revision.max_turns`
# (arriba) y `resumen()` solo lo escribía en watch.log como aviso: la card
# seguía su curso aunque se pasara. Ahora `devkit-run --worker` compara los
# turnos reales contra el valor de aquí y, si se excede, corta y bloquea la
# card con `task-block.sh` en vez de dejarla avanzar sin límite. La CLI
# instalada (2.1.274) sigue sin exponer `--max-turns` (igual que a los
# 2.1.270 del comentario de `revision.max_turns`), así que el corte es
# posterior a la ejecución, no un límite que Claude Code aplique mientras
# corre.
#
# Valores iniciales, decididos por el humano en DEVKIT-94 con las medidas de
# las hijas 87 a 90: pr-review entre 16 y 33 turnos, task-fix entre 30
# (ronda 2) y 87 (ronda 1), task-start entre 43 y 125 antes de
# `task-begin.sh`. Se ajustan con `devkit-run --costos` tras cuatro o cinco
# cards con el flujo nuevo. Una skill sin entrada aquí usa el `max_turns` de
# su rol (`implementacion` o `revision`, arriba); `task-submit` y
# `task-document` no tienen entrada propia a propósito, todavía con el valor
# de `implementacion.max_turns`.
presupuesto.task-start = 60
presupuesto.pr-review = 30
presupuesto.task-fix = 40
presupuesto.epic-plan = 40
