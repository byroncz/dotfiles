# ───────────────────────────────────────────────────────────────────────────
#  Template de devcontainer sobre Docker Compose.
#
#  IMPORTANTE: este archivo vive en .devcontainer/, así que TODAS las rutas
#  relativas (context, volumes, env_file) se resuelven desde .devcontainer/,
#  no desde la raíz del repo. Por eso el código se monta como "..".
#
#  Variables: se leen de .devcontainer/.env (ver .env.example). Ese archivo
#  NO se versiona y NO debe contener secretos: solo identificadores.
# ───────────────────────────────────────────────────────────────────────────

services:
  dev:
    build:
      context: .
      dockerfile: image/Dockerfile
      args:
        # Base por defecto: 27 MB comprimido. Cambiar solo si el proyecto
        # necesita otro runtime (p. ej. "python:3.11-slim", "node:22-slim").
        BASE_IMAGE: "${BASE_IMAGE:-debian:trixie-slim}"
        USERNAME: "${USERNAME:-vscode}"
        EXTRA_APT: "${EXTRA_APT:-}"
        INSTALL_AWSCLI: "${INSTALL_AWSCLI:-false}"
        PIP_PACKAGES: "${PIP_PACKAGES:-}"
        INSTALL_NVIM: "${INSTALL_NVIM:-true}"
        INSTALL_UV: "${INSTALL_UV:-true}"
        INSTALL_BASIC_MEMORY: "${INSTALL_BASIC_MEMORY:-true}"
        INSTALL_OPENSPEC: "${INSTALL_OPENSPEC:-true}"
        INSTALL_BACKLOG: "${INSTALL_BACKLOG:-true}"
        INSTALL_NOTION_MCP: "${INSTALL_NOTION_MCP:-true}"
        INSTALL_STOW: "${INSTALL_STOW:-true}"

    container_name: "${CLIENTE:-local}-${PROYECTO:-dev}"

    # Sin esto el contenedor arranca, no encuentra proceso que mantener y se
    # apaga de inmediato. El devcontainer necesita un PID 1 que no termine.
    command: sleep infinity

    volumes:
      # Solo ESTE repo, no el directorio padre: un devcontainer por proyecto
      # de un solo cliente. Evita que un sidecar de respaldo pueda alcanzar
      # código de otro cliente. Ruta destino FIJA (/workspace, singular) para
      # que no dependa del nombre del directorio local (Problema 9b).
      - ..:/workspace:cached

      # VOLUMEN, nunca un bind del ~/.claude del host. Montar el directorio
      # del host es el antipatrón que este template existe para evitar: todos
      # los proyectos acaban compartiendo login, historial y .claude.json, el
      # contexto de un cliente aparece en la sesión de otro, y el devcontainer
      # deja de ser reproducible porque depende del estado del portátil.
      # Aislado y vacío al empezar: cuesta un /login por cliente, y a cambio
      # lo que se respalda a rclone es solo de este cliente.
      - claude-config:/home/${USERNAME:-vscode}/.claude
      - git-home:/home/${USERNAME:-vscode}/.config/git
      - bash-history:/commandhistory
      - ide-extensions:/home/${USERNAME:-vscode}/.antigravity-ide-server/extensions

      # Basic Memory, en DOS volúmenes porque son dos cosas distintas:
      #   ~/basic-memory   los markdown. Es el conocimiento real, no se puede
      #                    regenerar, y por eso SÍ entra en el respaldo cifrado.
      #   ~/.basic-memory  el índice SQLite y la config. Se reconstruye entero
      #                    desde los markdown con `basic-memory reindex`, así que
      #                    NO se respalda: copiar un SQLite vivo mientras se
      #                    escribe es la forma habitual de acabar restaurando
      #                    una base corrupta.
      # Deliberadamente FUERA de ~/.claude: el conocimiento es del proyecto, no
      # del agente. Codex y cualquier otro deben poder leer el mismo directorio.
      - basic-memory:/home/${USERNAME:-vscode}/basic-memory
      - basic-memory-index:/home/${USERNAME:-vscode}/.basic-memory

      # Plugins y estado de Neovim. NO se respaldan: se reconstruyen
      # enteros desde nvim/ de este repo. El volumen solo evita volver a
      # descargarlos en cada rebuild.
      - nvim-data:/home/${USERNAME:-vscode}/.local/share/nvim
      - nvim-state:/home/${USERNAME:-vscode}/.local/state/nvim

      # Caché de uv (ruedas y fuentes descargadas). NO se respalda: es
      # reconstruible por definición, se vuelve a llenar descargando. El
      # volumen solo evita pagar la descarga otra vez en cada rebuild.
      - uv-cache:/home/${USERNAME:-vscode}/.cache/uv

    environment:
      DISABLE_AUTOUPDATER: "1"
      # Sin esto, ~/.claude.json queda FUERA del volumen y en cada rebuild se
      # pierden login OAuth, MCP servers y trust por proyecto (Problema 11).
      # El volumen por sí solo NO basta: hacen falta las dos cosas.
      CLAUDE_CONFIG_DIR: "/home/${USERNAME:-vscode}/.claude"
      # Sin esto, `git config --global` escribe ~/.gitconfig fuera del volumen
      # y ese archivo tiene prioridad sobre ~/.config/git/config (Problema 12).
      GIT_CONFIG_GLOBAL: "/home/${USERNAME:-vscode}/.config/git/config"
      # Ambas explícitas: por defecto Basic Memory deduce las rutas de $HOME,
      # y basta que algo cambie $HOME para que escriba fuera de los volúmenes
      # y el conocimiento se pierda en el siguiente rebuild. Verificado en
      # basic-memory 0.22.1 (config.py: resolve_data_dir / BASIC_MEMORY_HOME).
      BASIC_MEMORY_HOME: "/home/${USERNAME:-vscode}/basic-memory"
      BASIC_MEMORY_CONFIG_DIR: "/home/${USERNAME:-vscode}/.basic-memory"
      # Igual que arriba: explícita para que un $HOME distinto no parta la
      # caché en dos sin que nadie lo note.
      UV_CACHE_DIR: "/home/${USERNAME:-vscode}/.cache/uv"
      # Dentro de la caché a propósito: los intérpretes que uv descarga son
      # tan reconstruibles como las ruedas. Por defecto irían a
      # ~/.local/share/uv/python, fuera de todo volumen, y se perderían.
      UV_PYTHON_INSTALL_DIR: "/home/${USERNAME:-vscode}/.cache/uv/python"
      # Repo de dotfiles a clonar en ~/.dotfiles (gitignore global, config de
      # git, y más adelante nvim). Vacío = el container usa los valores por
      # defecto de git. Ver .env.example.
      DOTFILES_REPO: "${DOTFILES_REPO:-}"
      # Iconos de LazyVim. Apagado por defecto: sin la fuente instalada
      # en la terminal se ven cuadraditos. Ver .env.example.
      NERD_FONT: "${NERD_FONT:-false}"

    # Puertos de la aplicación del proyecto. Con compose, `forwardPorts` y
    # `appPort` de devcontainer.json se ignoran: los puertos van aquí.
    # El servidor de desarrollo DEBE escuchar en 0.0.0.0, no en 127.0.0.1.
    # ports:
    #   - "5173:5173"

  # ─────────────────────────────────────────────────────────────────────────
  #  SIDECARS DE RESPALDO
  #
  #  Cuatro contenedores hermanos, la misma imagen y el MISMO watch.sh. Lo
  #  único que cambia es qué vigilan, a dónde suben y cada cuánto.
  #
  #  Van aparte de `dev` a propósito: al cerrar el devcontainer, `dev` se
  #  para, y es justo cuando el respaldo más falta hace. Con
  #  shutdownAction "none" en devcontainer.json, estos siguen vivos.
  #
  #  Todos montan su origen en :ro. Aunque watch.sh tuviera un fallo, no
  #  puede tocar lo que vigila.
  #
  #  UN SOLO remoto crypt por cliente, `crypt-<CLIENTE>`, anclado en
  #  backups/devcontainers/<cliente>. Todo lo que cuelga de ahí va cifrado,
  #  nombres de carpeta incluidos.
  #
  #  Antes había un crypt por cada carpeta que se quería leer sin descifrar,
  #  y eso hacía que añadir un volumen nuevo costara una sesión de
  #  `rclone config`: un coste que crecía con cada volumen. Ahora un volumen
  #  nuevo es solo una subruta más dentro del mismo crypt, sin tocar rclone.
  #  El precio, aceptado a conciencia: en Dropbox solo se lee el nombre del
  #  cliente; qué hay dentro solo se ve descifrando con las claves.
  #
  #  Están bajo el perfil "respaldo": no arrancan hasta que pongas
  #  COMPOSE_PROFILES=respaldo en .env. Así el devcontainer funciona desde
  #  el primer día, antes de configurar rclone, sin sidecars reiniciándose
  #  en bucle porque no encuentran el remoto.
  # ─────────────────────────────────────────────────────────────────────────

  sync-claude:
    image: rclone/rclone:latest
    profiles: ["respaldo"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/watch.sh"]
    volumes:
      - ./backup/watch.sh:/watch.sh:ro
      - claude-config:/origen:ro
      # El origen va en :ro; la CONFIG no puede. Los tokens OAuth caducan
      # (4 h en Dropbox) y rclone guarda el renovado en rclone.conf. En :ro
      # falla con "Failed to save config" y lo renueva otra vez en cada
      # ciclo: hoy funciona porque el refresh_token aguanta, pero se rompería
      # el día que el proveedor los rote. Y como frontera de seguridad no
      # servía de nada: el sidecar ya tiene la contraseña del .conf.
      - ${HOME}/.config/rclone:/config/rclone
    # ${HOME}, nunca "~": compose no expande la virgulilla y buscaría un
    # directorio llamado "~" dentro de .devcontainer/.
    #
    # required: false para que la ausencia del archivo no impida arrancar.
    # Y la contraseña NO se declara además en `environment:`: ahí tiene
    # precedencia sobre env_file, así que si la variable no estuviera en la
    # shell, compose la interpolaría como cadena vacía y PISARÍA el valor
    # bueno. Un mecanismo, no dos.
    env_file:
      - path: ${HOME}/.config/rclone/devcontainer.env
        required: false
    environment:
      NOMBRE: "claude"
      DESTINO: "crypt-${CLIENTE:-local}:claude/datos"
      DESTINO_VERSIONES: "crypt-${CLIENTE:-local}:claude/versiones"
      INTERVALO: "30"
      MAX_INTERVAL: "900"

  sync-workspace:
    image: rclone/rclone:latest
    profiles: ["respaldo"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/watch.sh"]
    volumes:
      - ./backup/watch.sh:/watch.sh:ro
      - ./backup/filtros.txt:/filtros.txt:ro
      - ..:/origen:ro
      - ${HOME}/.config/rclone:/config/rclone
    env_file:
      - path: ${HOME}/.config/rclone/devcontainer.env
        required: false
    environment:
      NOMBRE: "workspace"
      DESTINO: "crypt-${CLIENTE:-local}:${PROYECTO:-dev}/workspace/datos"
      DESTINO_VERSIONES: "crypt-${CLIENTE:-local}:${PROYECTO:-dev}/workspace/versiones"
      # Más espaciado que el resto: el código cambia en ráfagas (un build,
      # un `npm install`) y no tiene sentido subir en mitad de una.
      INTERVALO: "120"
      MAX_INTERVAL: "3600"
      RCLONE_FILTERS: "/filtros.txt"

  sync-knowledge:
    image: rclone/rclone:latest
    profiles: ["respaldo"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/watch.sh"]
    volumes:
      - ./backup/watch.sh:/watch.sh:ro
      # Solo los markdown. El índice SQLite (basic-memory-index) NO se
      # respalda: se reconstruye con `basic-memory reindex`, y copiarlo en
      # caliente es la forma habitual de restaurar una base corrupta.
      - basic-memory:/origen:ro
      - ${HOME}/.config/rclone:/config/rclone
    env_file:
      - path: ${HOME}/.config/rclone/devcontainer.env
        required: false
    environment:
      NOMBRE: "knowledge"
      DESTINO: "crypt-${CLIENTE:-local}:knowledge/datos"
      DESTINO_VERSIONES: "crypt-${CLIENTE:-local}:knowledge/versiones"
      INTERVALO: "60"
      MAX_INTERVAL: "1800"

  sync-history:
    image: rclone/rclone:latest
    profiles: ["respaldo"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/watch.sh"]
    volumes:
      - ./backup/watch.sh:/watch.sh:ro
      - bash-history:/origen:ro
      - ${HOME}/.config/rclone:/config/rclone
    env_file:
      - path: ${HOME}/.config/rclone/devcontainer.env
        required: false
    environment:
      NOMBRE: "historial"
      # Sidecar propio en vez de colgar del de Claude: el historial debe
      # poder leerlo cualquier agente (Codex, OpenCode), no solo Claude.
      DESTINO: "crypt-${CLIENTE:-local}:${PROYECTO:-dev}/historial/datos"
      DESTINO_VERSIONES: "crypt-${CLIENTE:-local}:${PROYECTO:-dev}/historial/versiones"
      INTERVALO: "120"
      MAX_INTERVAL: "3600"

# ───────────────────────────────────────────────────────────────────────────
#  Volúmenes.
#
#  `name:` explícito en todos: sin él, compose antepone el nombre del
#  proyecto y los nombres reales dependerían de cómo se invoque el CLI.
#
#  claude-config va por CLIENTE, no por proyecto ni global: los transcripts
#  de un cliente no deben acabar en el respaldo cifrado de otro. El precio es
#  un `/login` por cliente, no uno por proyecto.
# ───────────────────────────────────────────────────────────────────────────
volumes:
  claude-config:
    name: "claude-${CLIENTE:-local}"
  git-home:
    name: "git-home"
  bash-history:
    name: "bash-history-${CLIENTE:-local}-${PROYECTO:-dev}"
  ide-extensions:
    name: "ide-extensions-${CLIENTE:-local}-${PROYECTO:-dev}"

  # Por CLIENTE, no por proyecto: el conocimiento acumulado sobre un cliente
  # sirve en todos sus proyectos. Nunca compartido entre clientes distintos,
  # por el mismo motivo que claude-config.
  basic-memory:
    name: "basic-memory-${CLIENTE:-local}"
  basic-memory-index:
    name: "basic-memory-index-${CLIENTE:-local}"

  # Por proyecto, no globales: varios devcontainers pueden estar abiertos
  # a la vez y lazy.nvim no espera que dos procesos escriban su estado.
  nvim-data:
    name: "nvim-data-${CLIENTE:-local}-${PROYECTO:-dev}"
  nvim-state:
    name: "nvim-state-${CLIENTE:-local}-${PROYECTO:-dev}"

  # Por CLIENTE y no por proyecto, al revés que nvim: uv sí está pensado para
  # que varios procesos compartan caché (usa bloqueo de archivos), y así los
  # proyectos de un mismo cliente se reaprovechan las descargas. Es caché:
  # perderlo entero no cuesta más que volver a bajarlo.
  uv-cache:
    name: "uv-cache-${CLIENTE:-local}"
